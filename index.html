<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Fiscal Eletrônica de Devolução - Arquitetura em Camadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; scroll-behavior: smooth; }
        .match-card { border-left: 4px solid #10b981; }
        .divergente-card { border-left: 4px solid #ef4444; }
        .sem-nfv-card { border-left: 4px solid #64748b; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        @keyframes piscarDestaque {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .highlight-target { animation: piscarDestaque 1.5s ease-out; }
    </style>
</head>
<body class="text-slate-800 p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Cabeçalho -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Auditoria Fiscal de Devolução</h1>
                <p class="text-sm text-slate-500 mt-1">Compliance fiscal proporcional entre Notas de Venda (NFV) e Devolução (NFD) — Arquitetura em Camadas.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="ExportadorModulo.exportarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">📊 CSV</button>
                <button onclick="ExportadorModulo.exportarExcel()" class="bg-green-700 hover:bg-green-800 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">📑 Excel</button>
                <button onclick="ExportadorModulo.exportarPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">🖨️ PDF</button>
                <button onclick="MainModulo.limparConsulta()" class="bg-slate-600 hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">🔄 Limpar</button>
            </div>
        </div>

        <!-- Painel de Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700">📦 XMLs de Venda (NFV)</h2>
                    <label class="cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 py-1.5 px-3 rounded-lg text-xs font-bold transition flex items-center border border-blue-200">
                        📁 Selecionar Arquivos
                        <input type="file" id="fileNFV" accept=".xml" multiple class="hidden" onchange="UtilsModulo.lerArquivos(event, 'xmlNFV')">
                    </label>
                </div>
                <textarea id="xmlNFV" class="w-full h-36 p-3 border border-slate-200 rounded-lg text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cole os XMLs de Venda ou selecione os arquivos..."></textarea>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700">🔄 XMLs de Devolução (NFD)</h2>
                    <label class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-1.5 px-3 rounded-lg text-xs font-bold transition flex items-center border border-indigo-200">
                        📁 Selecionar Arquivos
                        <input type="file" id="fileNFD" accept=".xml" multiple class="hidden" onchange="UtilsModulo.lerArquivos(event, 'xmlNFD')">
                    </label>
                </div>
                <textarea id="xmlNFD" class="w-full h-36 p-3 border border-slate-200 rounded-lg text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Cole os XMLs de Devolução ou selecione os arquivos..."></textarea>
            </div>
        </div>

        <!-- Barra de Progresso -->
        <div id="container-progresso" class="mb-6 hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between mb-1 text-xs font-bold text-slate-600">
                <span id="texto-progresso">Processando arquivos...</span>
                <span id="porcentagem-progresso">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                <div id="barra-progresso" class="bg-blue-600 h-2.5 rounded-full transition-all duration-150" style="width: 0%"></div>
            </div>
        </div>

        <!-- Botão Executar -->
        <div class="flex justify-center mb-8">
            <button onclick="MainModulo.executarAuditoria()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-10 rounded-xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 flex items-center gap-2 text-base">
                ⚡ Processar Auditoria Fiscal
            </button>
        </div>

        <!-- Avisos de Erro de Parser -->
        <div id="avisos" class="mb-6 hidden"></div>

        <!-- Dashboard -->
        <div id="painel-resumo" class="mb-6 hidden"></div>

        <!-- Filtros e Navegação -->
        <div id="painel-filtros" class="mb-6 hidden flex flex-wrap justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-3">
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">Filtros:</span>
                <button onclick="InterfaceModulo.filtrar('todos')" id="btn-filtro-todos" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition">Todos</button>
                <button onclick="InterfaceModulo.filtrar('divergente')" id="btn-filtro-divergente" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">❌ Divergentes</button>
                <button onclick="InterfaceModulo.filtrar('match')" id="btn-filtro-match" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">✅ Match</button>
                <button onclick="InterfaceModulo.filtrar('sem-nfv')" id="btn-filtro-sem-nfv" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">⚠️ Sem Nota Venda</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="InterfaceModulo.rolarParaDivergencia()" class="bg-red-50 hover:bg-red-100 text-red-700 font-bold text-xs px-3 py-2 rounded-lg border border-red-200 transition flex items-center gap-1">🎯 Ir para 1ª Divergência</button>
                <button onclick="InterfaceModulo.proximaDivergencia()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg transition flex items-center gap-1">⏭️ Próxima Divergência</button>
            </div>
        </div>

        <!-- Container Principal -->
        <div id="resultado-auditoria" class="space-y-6"></div>
    </div>

    <!-- Modal Memória de Cálculo -->
    <div id="modal-calculo" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-sm">🧮 Memória de Cálculo Proporcional</h3>
                <button onclick="InterfaceModulo.fecharModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
            </div>
            <div id="conteudo-modal-calculo" class="p-6 text-xs space-y-3 font-mono bg-slate-50 max-h-[70vh] overflow-y-auto"></div>
            <div class="bg-slate-100 p-3 text-right">
                <button onclick="InterfaceModulo.fecharModal()" class="bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-lg">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // CAMADA 1: UTILS (utils.js)
        // =========================================================================
        const UtilsModulo = {
            async lerArquivos(event, textAreaId) {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                
                const containerProg = document.getElementById('container-progresso');
                const barra = document.getElementById('barra-progresso');
                const textoProg = document.getElementById('texto-progresso');
                const porcento = document.getElementById('porcentagem-progresso');
                
                containerProg.classList.remove('hidden');
                let textosProcessados = [];
                
                for (let i = 0; i < files.length; i++) {
                    let conteudo = await this.readFileAsText(files[i]);
                    if (conteudo) {
                        conteudo = conteudo.replace(/^\uFEFF/, '');
                        const firstAngle = conteudo.indexOf('<');
                        if (firstAngle !== -1) conteudo = conteudo.substring(firstAngle);
                        textosProcessados.push(conteudo.trim());
                    }
                    let p = Math.round(((i + 1) / files.length) * 100);
                    barra.style.width = p + '%';
                    porcento.textContent = p + '%';
                    textoProg.textContent = `Lendo arquivo ${i + 1} de ${files.length}...`;
                }

                document.getElementById(textAreaId).value = textosProcessados.join('\n\n');
                setTimeout(() => containerProg.classList.add('hidden'), 800);
            },

            readFileAsText(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsText(file, "UTF-8");
                });
            },

            normalizarTexto(str) {
                return (str || '')
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, "");
            },

            formatVal(value, isCurrency = true) {
                if (typeof value !== 'number') return value;
                if (isCurrency) return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                return value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) + '%';
            },

            extrairNumNFDaChave(chave) {
                if (chave && chave.length === 44) {
                    return Number(chave.substring(25, 34)).toString();
                }
                return "N/A";
            }
        };

        // =========================================================================
        // CAMADA 2: PARSER (parser.js)
        // =========================================================================
        const ParserModulo = {
            getTagText(node, tagName) {
                if (!node) return '';
                const nsNodes = node.getElementsByTagNameNS('*', tagName);
                if (nsNodes.length > 0) return (nsNodes[0].textContent || '').trim();
                const normalNodes = node.getElementsByTagName(tagName);
                if (normalNodes.length > 0) return (normalNodes[0].textContent || '').trim();
                return '';
            },

            getTagVal(node, tagName) {
                const val = this.getTagText(node, tagName);
                return val ? parseFloat(val) : 0;
            },

            primeiroElemento(node, tagName) {
                if (!node) return null;
                const ns = node.getElementsByTagNameNS('*', tagName);
                if (ns.length > 0) return ns[0];
                const normal = node.getElementsByTagName(tagName);
                return normal.length > 0 ? normal[0] : null;
            },

            todosElementos(node, tagName) {
                if (!node) return [];
                const ns = Array.from(node.getElementsByTagNameNS('*', tagName));
                if (ns.length > 0) return ns;
                return Array.from(node.getElementsByTagName(tagName));
            },

            splitXmlDocs(text) {
                if (!text || !text.trim()) return [];
                const firstAngle = text.indexOf('<');
                if (firstAngle > 0) text = text.substring(firstAngle);
                const matches = text.match(/<nfeProc[\s\S]*?<\/nfeProc>|<NFe[\s\S]*?<\/NFe>/gi);
                if (matches && matches.length > 0) return matches;
                let parts = text.split(/(?=<\?xml|<nfeProc|<NFe\b|<enviNFe\b)/i);
                return parts.map(s => {
                    s = s.trim();
                    const idx = s.indexOf('<');
                    return idx > 0 ? s.substring(idx) : s;
                }).filter(Boolean);
            },

            extrairItem(det, noteMeta) {
                const prod = this.primeiroElemento(det, 'prod');
                const cEANraw = this.getTagText(prod, 'cEAN');
                const cEANTribraw = this.getTagText(prod, 'cEANTrib');
                const cProd = this.getTagText(prod, 'cProd');
                const xProd = this.getTagText(prod, 'xProd');
                const qCom = this.getTagVal(prod, 'qCom') || 1;
                const vUnCom = this.getTagVal(prod, 'vUnCom');
                const vProd = this.getTagVal(prod, 'vProd');
                const ncm = this.getTagText(prod, 'NCM');
                const cest = this.getTagText(prod, 'CEST');

                const up = s => (s || '').trim().toUpperCase();
                const codes = [];
                if (up(cEANraw) && up(cEANraw) !== 'SEM GTIN') codes.push(up(cEANraw));
                if (up(cEANTribraw) && up(cEANTribraw) !== 'SEM GTIN' && !codes.includes(up(cEANTribraw))) codes.push(up(cEANTribraw));

                const imposto = this.primeiroElemento(det, 'imposto');
                const icmsNode = this.primeiroElemento(imposto, 'ICMS');
                const grupo = icmsNode ? icmsNode.firstElementChild : null;

                return {
                    cEAN: up(cEANraw), cProd, xProd, qCom, vUnCom, vProd, codes, ncm, cest,
                    vBC: grupo ? this.getTagVal(grupo, 'vBC') : 0,
                    pICMS: grupo ? this.getTagVal(grupo, 'pICMS') : 0,
                    vICMS: grupo ? this.getTagVal(grupo, 'vICMS') : 0,
                    pRedBC: grupo ? this.getTagVal(grupo, 'pRedBC') : 0,
                    pDif: grupo ? this.getTagVal(grupo, 'pDif') : 0,
                    vICMSDif: grupo ? this.getTagVal(grupo, 'vICMSDif') : 0,
                    vBCST: grupo ? this.getTagVal(grupo, 'vBCST') : 0,
                    pICMSST: grupo ? this.getTagVal(grupo, 'pICMSST') : 0,
                    vICMSST: grupo ? this.getTagVal(grupo, 'vICMSST') : 0,
                    pMVAST: grupo ? this.getTagVal(grupo, 'pMVAST') : 0,
                    pRedBCST: grupo ? this.getTagVal(grupo, 'pRedBCST') : 0,
                    vBCFCP: grupo ? this.getTagVal(grupo, 'vBCFCP') : 0,
                    pFCP: grupo ? this.getTagVal(grupo, 'pFCP') : 0,
                    vFCP: grupo ? this.getTagVal(grupo, 'vFCP') : 0,
                    vBCFCPST: grupo ? this.getTagVal(grupo, 'vBCFCPST') : 0,
                    pFCPST: grupo ? this.getTagVal(grupo, 'pFCPST') : 0,
                    vFCPST: grupo ? this.getTagVal(grupo, 'vFCPST') : 0,
                    vDesc: this.getTagVal(imposto, 'vDesc'),
                    ...noteMeta
                };
            },

            parseNFeDoc(xmlText) {
                if (!xmlText.includes("</nfeProc>") && !xmlText.includes("</NFe>")) {
                    return { erro: 'Arquivo XML incompleto ou sem fechamento de tag válido.' };
                }
                let doc;
                try {
                    doc = new DOMParser().parseFromString(xmlText.trim(), 'text/xml');
                } catch (e) {
                    return { erro: 'Falha no DOMParser: ' + e.message };
                }
                if (doc.querySelector('parsererror')) return { erro: 'XML mal formado.' };
                
                const infNFe = this.primeiroElemento(doc, 'infNFe');
                if (!infNFe) return { erro: 'Tag <infNFe> não encontrada.' };

                const chave = (infNFe.getAttribute('Id') || '').replace(/^NFe/i, '');
                const ide = this.primeiroElemento(doc, 'ide');
                const nNF = this.getTagText(ide, 'nNF');
                const serie = this.getTagText(ide, 'serie');
                const dhEmi = this.getTagText(ide, 'dhEmi') || this.getTagText(ide, 'dEmi');
                const emit = this.primeiroElemento(doc, 'emit');
                const xNomeEmit = this.getTagText(emit, 'xNome');

                const refs = this.todosElementos(doc, 'refNFe').map(r => (r.textContent || '').trim());
                const refNums = refs.map(UtilsModulo.extrairNumNFDaChave);

                const noteMeta = { chave, nNF, serie, dhEmi, xNomeEmit, refs, refNums };
                const dets = this.todosElementos(doc, 'det');
                if (dets.length === 0) return { erro: `Nota ${nNF || chave} sem itens.` };

                const itens = dets.map(det => this.extrairItem(det, noteMeta));
                return { chave, nNF, itens };
            },

            parseCaixaTexto(texto) {
                const docs = this.splitXmlDocs(texto);
                const itens = [];
                const erros = [];
                docs.forEach((docTexto, idx) => {
                    const res = this.parseNFeDoc(docTexto);
                    if (res.erro) { erros.push({ indice: idx + 1, motivo: res.erro }); return; }
                    itens.push(...res.itens);
                });
                return { itens, erros, totalDocs: docs.length };
            }
        };

        // =========================================================================
        // CAMADA 3: REGRAS DE NEGÓCIO & CALCULADORA (calculadora.js)
        // =========================================================================
        const CalculadoraModulo = {
            extrairFatorEmbalagem(xProd) {
                if (!xProd) return 1;
                const match = xProd.match(/^(\d+)\s*[xX]\s*/);
                if (match) return parseInt(match[1], 10);
                const match2 = xProd.match(/\b(\d+)\s*[xX]\s*\d+/);
                if (match2) return parseInt(match2[1], 10);
                return 1;
            },

            calcularProporcionalidade(nfdItem, nfvItem) {
                const fator = this.extrairFatorEmbalagem(nfvItem.xProd);
                const totalUnidadesVendidas = nfvItem.qCom * fator;
                const qtdDevolvida = nfdItem.qCom;
                const percentual = totalUnidadesVendidas > 0 ? (qtdDevolvida / totalUnidadesVendidas) : 0;
                const valorUnitarioReal = fator > 1 ? (nfvItem.vUnCom / fator) : nfvItem.vUnCom;

                return {
                    fator,
                    totalUnidadesVendidas,
                    qtdDevolvida,
                    percentual,
                    valorUnitarioReal
                };
            }
        };

        // =========================================================================
        // CAMADA 4: SCORE (score.js)
        // =========================================================================
        const ScoreModulo = {
            calcular(nfdItem, nfvItem) {
                let score = 0;
                if (nfdItem.cEAN && nfvItem.codes.includes(nfdItem.cEAN)) score += 30;
                if (nfdItem.cProd === nfvItem.cProd) score += 20;
                
                const descNFD = UtilsModulo.normalizarTexto(nfdItem.xProd);
                const descNFV = UtilsModulo.normalizarTexto(nfvItem.xProd);
                if (descNFD === descNFV || descNFD.includes(descNFV) || descNFV.includes(descNFD)) score += 10;

                if (nfdItem.ncm === nfvItem.ncm) score += 10;
                if (nfdItem.pICMS === nfvItem.pICMS) score += 10;
                return score;
            }
        };

        // =========================================================================
        // CAMADA 5: COMPARADOR (comparador.js)
        // =========================================================================
        const ComparadorModulo = {
            comparar(nfdItem, nfvItem, tolerancia = 0.05) {
                const calc = CalculadoraModulo.calcularProporcionalidade(nfdItem, nfvItem);
                
                const checks = [];
                let qtdErros = 0;

                const avaliar = (label, esp, inf, isCurr = true) => {
                    const diff = Math.abs(esp - inf);
                    const ok = diff <= tolerancia;
                    if (!ok) qtdErros++;
                    checks.push({ label, esperado: esp, informado: inf, ok, isCurr });
                };

                const avaliarStr = (label, esp, inf) => {
                    const ok = String(esp).trim() === String(inf).trim();
                    if (!ok) qtdErros++;
                    checks.push({ label, esperado: esp, informado: inf, ok, isText: true });
                };

                // Regras e Checklist atualizados (sem CST/CSOSN e sem CFOP)
                const produtoOk = (nfdItem.cEAN && nfvItem.codes.includes(nfdItem.cEAN)) || (nfdItem.cProd === nfvItem.cProd);
                checks.push({ label: 'Produto correto', ok: produtoOk, isText: true });
                if (!produtoOk) qtdErros++;

                avaliar('Valor Unitário', calc.valorUnitarioReal, nfdItem.vUnCom, true);
                avaliar('MVA', nfvItem.pMVAST, nfvItem.pMVAST, false);
                avaliar('Redução ICMS', nfvItem.pRedBC, nfvItem.pRedBC, false);
                avaliar('Redução ST', nfvItem.pRedBCST, nfvItem.pRedBCST, false);
                avaliar('Alíquota ICMS', nfvItem.pICMS, nfvItem.pICMS, false);
                avaliar('Alíquota ST', nfvItem.pICMSST, nfvItem.pICMSST, false);
                avaliar('Alíquota FCP', nfvItem.pFCP, nfvItem.pFCP, false);
                avaliar('Diferimento', nfvItem.pDif, nfvItem.pDif, false);

                // Valores Proporcionais
                avaliar('Base ICMS Proporcional', nfvItem.vBC * calc.percentual, nfdItem.vBC, true);
                avaliar('Valor ICMS Proporcional', nfvItem.vICMS * calc.percentual, nfdItem.vICMS, true);
                avaliar('Base ST Proporcional', nfvItem.vBCST * calc.percentual, nfdItem.vBCST, true);
                avaliar('Valor ST Proporcional', nfvItem.vICMSST * calc.percentual, nfdItem.vICMSST, true);
                avaliar('Valor FCP Proporcional', nfvItem.vFCP * calc.percentual, nfdItem.vFCP, true);

                const statusGeral = qtdErros === 0 ? 'match' : 'divergente';

                return {
                    calc,
                    checks,
                    statusGeral,
                    qtdErros
                };
            }
        };

        // =========================================================================
        // CAMADA 6: DASHBOARD (dashboard.js)
        // =========================================================================
        const DashboardModulo = {
            renderizar(totalXMLs, produtosCount, recomendadasCount, matchCount, divCount, semCount, tempoMs) {
                const painel = document.getElementById('painel-resumo');
                painel.classList.remove('hidden');
                painel.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-7 gap-4">
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 text-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Total XMLs</span>
                            <p class="text-xl font-black text-slate-800 mt-1">${totalXMLs}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 text-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Produtos NFD</span>
                            <p class="text-xl font-black text-slate-800 mt-1">${produtosCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-indigo-200 text-center bg-indigo-50/40">
                            <span class="text-[10px] font-bold text-indigo-600 uppercase">Notas Recomendadas</span>
                            <p class="text-xl font-black text-indigo-700 mt-1">${recomendadasCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-emerald-200 text-center bg-emerald-50/40">
                            <span class="text-[10px] font-bold text-emerald-600 uppercase">Itens Corretos</span>
                            <p class="text-xl font-black text-emerald-700 mt-1">${matchCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-red-200 text-center bg-red-50/40">
                            <span class="text-[10px] font-bold text-red-600 uppercase">Itens Divergentes</span>
                            <p class="text-xl font-black text-red-700 mt-1">${divCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-300 text-center bg-slate-50">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Sem Nota Venda</span>
                            <p class="text-xl font-black text-slate-700 mt-1">${semCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-blue-200 text-center bg-blue-50/40">
                            <span class="text-[10px] font-bold text-blue-600 uppercase">Processamento</span>
                            <p class="text-xl font-black text-blue-700 mt-1">${tempoMs}ms</p>
                        </div>
                    </div>
                `;
            }
        };

        // =========================================================================
        // CAMADA 7: INTERFACE (interface.js)
        // =========================================================================
        const InterfaceModulo = {
            indiceDivergenciaAtual: -1,

            renderizarCartao(d, index) {
                const statusClasse = d.status === 'match' ? 'match-card bg-emerald-50/20' : (d.status === 'divergente' ? 'divergente-card bg-red-50/20' : 'sem-nfv-card bg-slate-50');
                const badgeClasse = d.status === 'match' ? 'bg-emerald-100 text-emerald-800' : (d.status === 'divergente' ? 'bg-red-100 text-red-800' : 'bg-slate-200 text-slate-700');
                const badgeTexto = d.status === 'match' ? '✅ CORRETO' : (d.status === 'divergente' ? '❌ DIVERGENTE' : '⚠️ SEM NOTA DE VENDA');

                // Checklist HTML
                let checklistHtml = '';
                if (d.checks && d.checks.length > 0) {
                    const itensChecklist = d.checks.map(c => {
                        if (c.isText) {
                            return `<div class="flex items-center justify-between text-xs py-1 border-b border-slate-100">
                                <span class="font-medium text-slate-700">${c.label}</span>
                                <span class="${c.ok ? 'text-emerald-600 font-bold' : 'text-red-600 font-bold'}">${c.ok ? '✔ Igual / Compatível' : '❌ Divergente'}</span>
                            </div>`;
                        }
                        const espStr = UtilsModulo.formatVal(c.esperado, c.isCurr);
                        const infStr = UtilsModulo.formatVal(c.informado, c.isCurr);
                        return `<div class="flex items-center justify-between text-xs py-1 border-b border-slate-100">
                            <span class="font-medium text-slate-700">${c.label} (Esp: <code class="text-slate-900">${espStr}</code> | Inf: <code class="text-slate-900">${infStr}</code>)</span>
                            <span class="${c.ok ? 'text-emerald-600 font-bold' : 'text-red-600 font-bold'}">${c.ok ? '✔ Correto' : '❌ Erro'}</span>
                        </div>`;
                    }).join('');
                    checklistHtml = `<div class="bg-white p-3 rounded-lg border border-slate-200 space-y-1 mb-3">${itensChecklist}</div>`;
                }

                // Outras Notas Encontradas
                let outrasNotasHtml = '';
                if (d.outrasNotas && d.outrasNotas.length > 0) {
                    const lista = d.outrasNotas.map(o => `<li>NF-e ${o.nNF} - Emissor: ${o.xNomeEmit || 'N/A'} (Score: ${o.score})</li>`).join('');
                    outrasNotasHtml = `
                        <details class="mt-3 text-xs bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <summary class="font-bold text-slate-700 cursor-pointer flex justify-between items-center">
                                <span>📂 Outras Notas Encontradas (${d.outrasNotas.length})</span>
                                <span class="text-blue-600">▼ Expandir</span>
                            </summary>
                            <ul class="mt-2 space-y-1 pl-4 list-disc text-slate-600">${lista}</ul>
                        </details>
                    `;
                }

                const html = `
                    <div id="cartao-${index}" class="cartao-auditoria bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${statusClasse}" data-status="${d.status}">
                        <div class="p-4 flex justify-between items-center gap-4 border-b border-slate-200 bg-white">
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Item Devolução #${index + 1}</span>
                                <h3 class="font-bold text-sm md:text-base text-slate-900">${d.xProd}</h3>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-black shadow-sm ${badgeClasse}">${badgeTexto}</span>
                        </div>
                        <div class="p-5">
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4 text-xs bg-slate-50 p-3 rounded-lg border border-slate-200 font-mono">
                                <div><b>Qtd Devolução:</b> ${d.calc.qtdDevolvida} un</div>
                                <div><b>NF Venda Ref:</b> ${d.nNFV || 'N/A'}</div>
                                <div><b>Qtd Venda:</b> ${d.calc.totalUnidadesVendidas} un</div>
                                <div><b>Percentual:</b> ${(d.calc.percentual * 100).toFixed(2)}%</div>
                                <div><button onclick="InterfaceModulo.abrirMemoriaCalculo(${index})" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded text-[11px] transition w-full">🧮 Ver Cálculo</button></div>
                            </div>
                            ${checklistHtml}
                            ${outrasNotasHtml}
                        </div>
                    </div>
                `;
                document.getElementById('resultado-auditoria').insertAdjacentHTML('beforeend', html);
            },

            abrirMemoriaCalculo(index) {
                const item = window.dadosGlobaisAuditoria[index];
                if (!item) return;
                const c = item.calc;
                const conteudo = `
                    <p class="font-bold text-slate-900 text-sm mb-2">Produto: ${item.xProd}</p>
                    <div class="space-y-1 border-t border-slate-200 pt-2">
                        <p>📦 Fator de Embalagem: <b>${c.fator} un/caixa</b></p>
                        <p>📊 Quantidade Total Vendida: <b>${c.totalUnidadesVendidas} unidades</b></p>
                        <p>🔄 Quantidade Devolvida: <b>${c.qtdDevolvida} unidades</b></p>
                        <p class="text-blue-600 font-bold">➡️ Percentual Devolvido: ${c.qtdDevolvida} ÷ ${c.totalUnidadesVendidas} = ${(c.percentual * 100).toFixed(4)}%</p>
                        <hr class="my-2">
                        <p class="text-slate-600 font-bold">Fórmula aplicada para cada imposto:</p>
                        <p>Valor Esperado = Valor Venda Original × ${(c.percentual * 100).toFixed(2)}%</p>
                        <p>Compara-se o <b>Valor Esperado</b> com o <b>Valor Informado na Devolução</b>.</p>
                    </div>
                `;
                document.getElementById('conteudo-modal-calculo').innerHTML = conteudo;
                document.getElementById('modal-calculo').classList.remove('hidden');
                document.getElementById('modal-calculo').classList.add('flex');
            },

            fecharModal() {
                document.getElementById('modal-calculo').classList.remove('flex');
                document.getElementById('modal-calculo').classList.add('hidden');
            },

            filtrar(filtro) {
                ['todos', 'divergente', 'match', 'sem-nfv'].forEach(f => {
                    const btn = document.getElementById(`btn-filtro-${f}`);
                    if (!btn) return;
                    btn.className = f === filtro ? "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition" : "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                });
                document.querySelectorAll('.cartao-auditoria').forEach(card => {
                    const status = card.getAttribute('data-status');
                    card.style.display = (filtro === 'todos' || status === filtro) ? 'block' : 'none';
                });
            },

            rolarParaDivergencia() {
                const divs = Array.from(document.querySelectorAll('.cartao-auditoria')).filter(c => c.getAttribute('data-status') === 'divergente');
                if (divs.length === 0) return alert("Nenhuma divergência encontrada!");
                this.indiceDivergenciaAtual = 0;
                const el = divs[this.indiceDivergenciaAtual];
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.remove('highlight-target'); void el.offsetWidth; el.classList.add('highlight-target');
            },

            proximaDivergencia() {
                const divs = Array.from(document.querySelectorAll('.cartao-auditoria')).filter(c => c.getAttribute('data-status') === 'divergente');
                if (divs.length === 0) return alert("Nenhuma divergência encontrada!");
                this.indiceDivergenciaAtual = (this.indiceDivergenciaAtual + 1) % divs.length;
                const el = divs[this.indiceDivergenciaAtual];
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.remove('highlight-target'); void el.offsetWidth; el.classList.add('highlight-target');
            }
        };

        // =========================================================================
        // CAMADA 8: EXPORTADOR (exportador.js)
        // =========================================================================
        const ExportadorModulo = {
            exportarCSV() {
                if (window.dadosGlobaisAuditoria.length === 0) return alert("Sem dados.");
                let csv = "Produto;Status;Qtd Devolucao;NF Venda;Percentual\n";
                window.dadosGlobaisAuditoria.forEach(d => {
                    csv += `"${d.xProd}";"${d.status}";"${d.calc.qtdDevolvida}";"${d.nNFV || 'N/A'}";"${(d.calc.percentual * 100).toFixed(2)}%"\n`;
                });
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'auditoria_fiscal.csv'; a.click();
            },
            exportarExcel() {
                if (window.dadosGlobaisAuditoria.length === 0) return alert("Sem dados.");
                let html = '<table><tr><th>Produto</th><th>Status</th><th>Qtd Devolução</th><th>NF Venda</th></tr>';
                window.dadosGlobaisAuditoria.forEach(d => {
                    html += `<tr><td>${d.xProd}</td><td>${d.status}</td><td>${d.calc.qtdDevolvida}</td><td>${d.nNFV || 'N/A'}</td></tr>`;
                });
                html += '</table>';
                const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'auditoria_fiscal.xls'; a.click();
            },
            exportarPDF() { window.print(); }
        };

        // =========================================================================
        // CAMADA 9: MAIN / CONTROLADOR (main.js)
        // =========================================================================
        const MainModulo = {
            limparConsulta() {
                document.getElementById('xmlNFV').value = '';
                document.getElementById('xmlNFD').value = '';
                document.getElementById('fileNFV').value = '';
                document.getElementById('fileNFD').value = '';
                document.getElementById('resultado-auditoria').innerHTML = '';
                document.getElementById('painel-resumo').innerHTML = '';
                document.getElementById('painel-resumo').classList.add('hidden');
                document.getElementById('painel-filtros').classList.add('hidden');
                document.getElementById('avisos').innerHTML = '';
                document.getElementById('avisos').classList.add('hidden');
                window.dadosGlobaisAuditoria = [];
            },

            executarAuditoria() {
                const tempoInicio = performance.now();
                const strNFV = document.getElementById('xmlNFV').value;
                const strNFD = document.getElementById('xmlNFD').value;
                const container = document.getElementById('resultado-auditoria');

                container.innerHTML = '';
                document.getElementById('painel-resumo').innerHTML = '';
                document.getElementById('painel-resumo').classList.add('hidden');
                document.getElementById('painel-filtros').classList.add('hidden');
                document.getElementById('avisos').innerHTML = '';
                document.getElementById('avisos').classList.add('hidden');
                window.dadosGlobaisAuditoria = [];

                if (!strNFV || !strNFD) return alert("Insira os XMLs de Venda e Devolução.");

                const resNFD = ParserModulo.parseCaixaTexto(strNFD);
                const resNFV = ParserModulo.parseCaixaTexto(strNFV);

                if (resNFD.erros.length > 0 || resNFV.erros.length > 0) {
                    const el = document.getElementById('avisos');
                    el.classList.remove('hidden');
                    el.innerHTML = `<div class="p-4 bg-amber-50 border border-amber-300 rounded-xl text-amber-900 text-xs">⚠️ Alguns arquivos XML foram ignorados por formato inválido.</div>`;
                }

                if (resNFD.itens.length === 0 || resNFV.itens.length === 0) return alert("Nenhum item válido encontrado.");

                // Indexação via Map() para alta performance
                const mapaChave = new Map();
                const mapaEAN = new Map();
                const mapaCodigo = new Map();

                resNFV.itens.forEach(item => {
                    if (item.chave) {
                        if (!mapaChave.has(item.chave)) mapaChave.set(item.chave, []);
                        mapaChave.get(item.chave).push(item);
                    }
                    item.codes.forEach(ean => {
                        if (!mapaEAN.has(ean)) mapaEAN.set(ean, []);
                        mapaEAN.get(ean).push(item);
                    });
                    if (item.cProd) {
                        if (!mapaCodigo.has(item.cProd)) mapaCodigo.set(item.cProd, []);
                        mapaCodigo.get(item.cProd).push(item);
                    }
                });

                let matchCount = 0, divCount = 0, semCount = 0, recomendadasCount = 0;

                resNFD.itens.forEach(nfdItem => {
                    let escopo = [];
                    if (nfdItem.refs && nfdItem.refs.length > 0) {
                        nfdItem.refs.forEach(ch => { if (mapaChave.has(ch)) escopo.push(...mapaChave.get(ch)); });
                    }
                    if (escopo.length === 0) {
                        nfdItem.codes.forEach(ean => { if (mapaEAN.has(ean)) escopo.push(...mapaEAN.get(ean)); });
                    }
                    if (escopo.length === 0 && nfdItem.cProd && mapaCodigo.has(nfdItem.cProd)) {
                        escopo.push(...mapaCodigo.get(nfdItem.cProd));
                    }
                    if (escopo.length === 0) escopo = resNFV.itens;

                    const vistos = new Set();
                    const candidatos = escopo.filter(c => {
                        const k = c.chave + '|' + c.cProd + '|' + c.nNF;
                        if (vistos.has(k)) return false;
                        vistos.add(k);
                        return true;
                    });

                    if (candidatos.length === 0) {
                        semCount++;
                        const dados = {
                            status: 'sem-nfv', xProd: nfdItem.xProd, calc: { qtdDevolvida: nfdItem.qCom, totalUnidadesVendidas: 0, percentual: 0 },
                            checks: [], outrasNotas: []
                        };
                        window.dadosGlobaisAuditoria.push(dados);
                        InterfaceModulo.renderizarCartao(dados, window.dadosGlobaisAuditoria.length - 1);
                        return;
                    }

                    // Pontuação por Score
                    const pontuados = candidatos.map(candidato => ({
                        item: candidato,
                        score: ScoreModulo.calcular(nfdItem, candidato),
                        resComp: ComparadorModulo.comparar(nfdItem, candidato)
                    })).sort((a, b) => b.score - a.score);

                    const melhor = pontuados[0];
                    recomendadasCount++;

                    if (melhor.resComp.statusGeral === 'match') matchCount++;
                    else divCount++;

                    const outrasNotas = pontuados.slice(1).map(p => ({ nNF: p.item.nNF, xNomeEmit: p.item.xNomeEmit, score: p.score }));

                    const dados = {
                        status: melhor.resComp.statusGeral,
                        xProd: nfdItem.xProd,
                        nNFV: melhor.item.nNF,
                        calc: melhor.resComp.calc,
                        checks: melhor.resComp.checks,
                        outrasNotas
                    };

                    window.dadosGlobaisAuditoria.push(dados);
                    InterfaceModulo.renderizarCartao(dados, window.dadosGlobaisAuditoria.length - 1);
                });

                const tempoMs = Math.round(performance.now() - tempoInicio);
                DashboardModulo.renderizar(resNFV.totalDocs + resNFD.totalDocs, resNFD.itens.length, recomendadasCount, matchCount, divCount, semCount, tempoMs);
                document.getElementById('painel-filtros').classList.remove('hidden');
            }
        };

        window.dadosGlobaisAuditoria = [];
    </script>
</body>
</html>
