<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Fiscal Eletrônica de Devolução - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; scroll-behavior: smooth; }
        .match { background-color: #ecfdf5; color: #065f46; border-left: 4px solid #10b981; }
        .divergente { background-color: #fef2f2; color: #991b1b; border-left: 4px solid #ef4444; }
        .sem-nfv { background-color: #f1f5f9; color: #334155; border-left: 4px solid #64748b; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        @keyframes piscarDestaque {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .highlight-target { animation: piscarDestaque 1.5s ease-out; }
    </style>
</head>
<body class="text-slate-800 p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Cabeçalho -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Auditoria Fiscal de Devolução</h1>
                <p class="text-sm text-slate-500 mt-1">Sistema corporativo de cruzamento e compliance entre Notas de Venda (NFV) e Devolução (NFD).</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="ExportadorModulo.exportarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">
                    📊 Exportar CSV
                </button>
                <button onclick="ExportadorModulo.exportarExcel()" class="bg-green-700 hover:bg-green-800 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">
                    📑 Exportar Excel
                </button>
                <button onclick="ExportadorModulo.exportarPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">
                    🖨️ Imprimir / PDF
                </button>
                <button onclick="AppModulo.limparDados()" class="bg-slate-600 hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center">
                    🔄 Zerar Consulta
                </button>
            </div>
        </div>

        <!-- Painel de Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 flex items-center gap-2">📦 XMLs de Venda (NFV)</h2>
                    <label class="cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 py-1.5 px-3 rounded-lg text-xs font-bold transition flex items-center border border-blue-200">
                        📁 Selecionar Arquivos
                        <input type="file" id="fileNFV" accept=".xml" multiple class="hidden" onchange="UtilsModulo.lerArquivos(event, 'xmlNFV')">
                    </label>
                </div>
                <textarea id="xmlNFV" class="w-full h-36 p-3 border border-slate-200 rounded-lg text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cole os XMLs de Venda ou selecione os arquivos..."></textarea>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 flex items-center gap-2">🔄 XMLs de Devolução (NFD)</h2>
                    <label class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-1.5 px-3 rounded-lg text-xs font-bold transition flex items-center border border-indigo-200">
                        📁 Selecionar Arquivos
                        <input type="file" id="fileNFD" accept=".xml" multiple class="hidden" onchange="UtilsModulo.lerArquivos(event, 'xmlNFD')">
                    </label>
                </div>
                <textarea id="xmlNFD" class="w-full h-36 p-3 border border-slate-200 rounded-lg text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Cole os XMLs de Devolução ou selecione os arquivos..."></textarea>
            </div>
        </div>

        <!-- Barra de Progresso -->
        <div id="container-progresso" class="mb-6 hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between mb-1 text-xs font-bold text-slate-600">
                <span id="texto-progresso">Processando arquivos...</span>
                <span id="porcentagem-progresso">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                <div id="barra-progresso" class="bg-blue-600 h-2.5 rounded-full transition-all duration-150" style="width: 0%"></div>
            </div>
        </div>

        <!-- Botão Executar -->
        <div class="flex justify-center mb-8">
            <button onclick="AppModulo.executarAuditoria()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-10 rounded-xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 flex items-center gap-2 text-base">
                ⚡ Processar Auditoria Fiscal
            </button>
        </div>

        <!-- Alertas de Erros de Parser -->
        <div id="avisos" class="mb-6 hidden"></div>

        <!-- Dashboard Dinâmico -->
        <div id="painel-resumo" class="mb-6 hidden"></div>

        <!-- Filtros e Navegação Rápida -->
        <div id="painel-filtros" class="mb-6 hidden flex flex-wrap justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-3">
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">Filtros:</span>
                <button onclick="InterfaceModulo.filtrar('todos')" id="btn-filtro-todos" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition">Todos</button>
                <button onclick="InterfaceModulo.filtrar('divergente')" id="btn-filtro-divergente" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">❌ Divergentes</button>
                <button onclick="InterfaceModulo.filtrar('match')" id="btn-filtro-match" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">✅ Match</button>
                <button onclick="InterfaceModulo.filtrar('sem-nfv')" id="btn-filtro-sem-nfv" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">⚠️ Sem Nota Venda</button>
                <button onclick="InterfaceModulo.filtrar('recomendada')" id="btn-filtro-recomendada" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">⭐ Apenas Recomendadas</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="InterfaceModulo.rolarParaDivergencia()" class="bg-red-50 hover:bg-red-100 text-red-700 font-bold text-xs px-3 py-2 rounded-lg border border-red-200 transition flex items-center gap-1">
                    🎯 Ver Divergências
                </button>
                <button onclick="InterfaceModulo.proximaDivergencia()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg transition flex items-center gap-1">
                    ⏭️ Próxima Divergência
                </button>
            </div>
        </div>

        <!-- Container de Resultados -->
        <div id="resultado-auditoria" class="space-y-6"></div>
    </div>

    <script>
        // =========================================================================
        // MÓDULO 1: UTILS & HELPERS (utils.js)
        // =========================================================================
        const UtilsModulo = {
            async lerArquivos(event, textAreaId) {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                
                const containerProg = document.getElementById('container-progresso');
                const barra = document.getElementById('barra-progresso');
                const textoProg = document.getElementById('texto-progresso');
                const porcento = document.getElementById('porcentagem-progresso');
                
                containerProg.classList.remove('hidden');
                let textosProcessados = [];
                
                for (let i = 0; i < files.length; i++) {
                    let conteudo = await this.readFileAsText(files[i]);
                    if (conteudo) {
                        conteudo = conteudo.replace(/^\uFEFF/, '');
                        const firstAngle = conteudo.indexOf('<');
                        if (firstAngle !== -1) conteudo = conteudo.substring(firstAngle);
                        textosProcessados.push(conteudo.trim());
                    }
                    let p = Math.round(((i + 1) / files.length) * 100);
                    barra.style.width = p + '%';
                    porcento.textContent = p + '%';
                    textoProg.textContent = `Lendo arquivo ${i + 1} de ${files.length}...`;
                }

                document.getElementById(textAreaId).value = textosProcessados.join('\n\n');
                setTimeout(() => containerProg.classList.add('hidden'), 800);
            },

            readFileAsText(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsText(file, "UTF-8");
                });
            },

            normalizarTexto(str) {
                return (str || '')
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, "");
            },

            extrairFatorEmbalagem(xProd) {
                if (!xProd) return 1;
                const match = xProd.match(/^(\d+)\s*[xX]\s*/);
                if (match) return parseInt(match[1], 10);
                const match2 = xProd.match(/\b(\d+)\s*[xX]\s*\d+/);
                if (match2) return parseInt(match2[1], 10);
                return 1;
            },

            formatVal(value, isCurrency) {
                if (isCurrency) return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                return value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) + '%';
            },

            extrairNumNFDaChave(chave) {
                if (chave && chave.length === 44) {
                    return Number(chave.substring(25, 34)).toString();
                }
                return "N/A";
            }
        };

        // =========================================================================
        // MÓDULO 2: PARSER DE XML ROBUSTO (parser.js)
        // =========================================================================
        const ParserModulo = {
            getTagText(node, tagName) {
                if (!node) return '';
                const nsNodes = node.getElementsByTagNameNS('*', tagName);
                if (nsNodes.length > 0) return (nsNodes[0].textContent || '').trim();
                const normalNodes = node.getElementsByTagName(tagName);
                if (normalNodes.length > 0) return (normalNodes[0].textContent || '').trim();
                return '';
            },

            getTagVal(node, tagName) {
                const val = this.getTagText(node, tagName);
                return val ? parseFloat(val) : 0;
            },

            primeiroElemento(node, tagName) {
                if (!node) return null;
                const ns = node.getElementsByTagNameNS('*', tagName);
                if (ns.length > 0) return ns[0];
                const normal = node.getElementsByTagName(tagName);
                return normal.length > 0 ? normal[0] : null;
            },

            todosElementos(node, tagName) {
                if (!node) return [];
                const ns = Array.from(node.getElementsByTagNameNS('*', tagName));
                if (ns.length > 0) return ns;
                return Array.from(node.getElementsByTagName(tagName));
            },

            splitXmlDocs(text) {
                if (!text || !text.trim()) return [];
                const firstAngle = text.indexOf('<');
                if (firstAngle > 0) text = text.substring(firstAngle);
                const matches = text.match(/<nfeProc[\s\S]*?<\/nfeProc>|<NFe[\s\S]*?<\/NFe>/gi);
                if (matches && matches.length > 0) return matches;
                let parts = text.split(/(?=<\?xml|<nfeProc|<NFe\b|<enviNFe\b)/i);
                return parts.map(s => {
                    s = s.trim();
                    const idx = s.indexOf('<');
                    return idx > 0 ? s.substring(idx) : s;
                }).filter(Boolean);
            },

            extrairItem(det, noteMeta) {
                const prod = this.primeiroElemento(det, 'prod');
                const cEANraw = this.getTagText(prod, 'cEAN');
                const cEANTribraw = this.getTagText(prod, 'cEANTrib');
                const cProd = this.getTagText(prod, 'cProd');
                const xProd = this.getTagText(prod, 'xProd');
                const qCom = this.getTagVal(prod, 'qCom') || 1;
                const vUnCom = this.getTagVal(prod, 'vUnCom');
                const vProd = this.getTagVal(prod, 'vProd');
                const ncm = this.getTagText(prod, 'NCM');
                const cest = this.getTagText(prod, 'CEST');
                const cfop = this.getTagText(prod, 'CFOP');

                const up = s => (s || '').trim().toUpperCase();
                const codes = [];
                if (up(cEANraw) && up(cEANraw) !== 'SEM GTIN') codes.push(up(cEANraw));
                if (up(cEANTribraw) && up(cEANTribraw) !== 'SEM GTIN' && !codes.includes(up(cEANTribraw))) codes.push(up(cEANTribraw));

                const imposto = this.primeiroElemento(det, 'imposto');
                const icmsNode = this.primeiroElemento(imposto, 'ICMS');
                const grupo = icmsNode ? icmsNode.firstElementChild : null;
                const cst = grupo ? (this.getTagText(grupo, 'CST') || this.getTagText(grupo, 'CSOSN') || 'N/A') : 'N/A';
                const csosn = cst;

                // Fatores de embalagem
                const fator = UtilsModulo.extrairFatorEmbalagem(xProd);
                const vUnComReal = fator > 1 ? (vUnCom / fator) : vUnCom;

                return {
                    cEAN: up(cEANraw), cProd, xProd, qCom, vUnCom: vUnComReal, vProd, codes, cst, csosn, ncm, cest, cfop,
                    vBC: grupo ? this.getTagVal(grupo, 'vBC') : 0,
                    pICMS: grupo ? this.getTagVal(grupo, 'pICMS') : 0,
                    vICMS: grupo ? this.getTagVal(grupo, 'vICMS') : 0,
                    pRedBC: grupo ? this.getTagVal(grupo, 'pRedBC') : 0,
                    pDif: grupo ? this.getTagVal(grupo, 'pDif') : 0,
                    vICMSDif: grupo ? this.getTagVal(grupo, 'vICMSDif') : 0,
                    vBCST: grupo ? this.getTagVal(grupo, 'vBCST') : 0,
                    pICMSST: grupo ? this.getTagVal(grupo, 'pICMSST') : 0,
                    vICMSST: grupo ? this.getTagVal(grupo, 'vICMSST') : 0,
                    pMVAST: grupo ? this.getTagVal(grupo, 'pMVAST') : 0,
                    pRedBCST: grupo ? this.getTagVal(grupo, 'pRedBCST') : 0,
                    vBCFCP: grupo ? this.getTagVal(grupo, 'vBCFCP') : 0,
                    pFCP: grupo ? this.getTagVal(grupo, 'pFCP') : 0,
                    vFCP: grupo ? this.getTagVal(grupo, 'vFCP') : 0,
                    vBCFCPST: grupo ? this.getTagVal(grupo, 'vBCFCPST') : 0,
                    pFCPST: grupo ? this.getTagVal(grupo, 'pFCPST') : 0,
                    vFCPST: grupo ? this.getTagVal(grupo, 'vFCPST') : 0,
                    vDesc: this.getTagVal(imposto, 'vDesc'),
                    ...noteMeta
                };
            },

            parseNFeDoc(xmlText) {
                if (!xmlText.includes("</nfeProc>") && !xmlText.includes("</NFe>")) {
                    return { erro: 'Arquivo XML incompleto ou sem fechamento de tag válido.' };
                }
                let doc;
                try {
                    doc = new DOMParser().parseFromString(xmlText.trim(), 'text/xml');
                } catch (e) {
                    return { erro: 'Falha crítica no DOMParser: ' + e.message };
                }
                const errEl = doc.querySelector('parsererror') || doc.getElementsByTagName('parsererror')[0];
                if (errEl) {
                    return { erro: 'XML mal formado.' };
                }
                const infNFe = this.primeiroElemento(doc, 'infNFe');
                if (!infNFe) return { erro: 'Tag <infNFe> não encontrada.' };

                const idAttr = infNFe.getAttribute('Id') || '';
                const chave = idAttr.replace(/^NFe/i, '');
                const ide = this.primeiroElemento(doc, 'ide');
                const nNF = this.getTagText(ide, 'nNF');
                const serie = this.getTagText(ide, 'serie');
                const dhEmi = this.getTagText(ide, 'dhEmi') || this.getTagText(ide, 'dEmi');

                const refs = this.todosElementos(doc, 'refNFe').map(r => (r.textContent || '').trim());
                const refNums = refs.map(UtilsModulo.extrairNumNFDaChave);

                const noteMeta = { chave, nNF, serie, dhEmi, refs, refNums };
                const dets = this.todosElementos(doc, 'det');
                if (dets.length === 0) return { erro: `A nota ${nNF || chave} não possui itens.` };

                const itens = dets.map(det => this.extrairItem(det, noteMeta));
                return { chave, nNF, itens };
            },

            parseCaixaTexto(texto) {
                const docs = this.splitXmlDocs(texto);
                const itens = [];
                const erros = [];
                docs.forEach((docTexto, idx) => {
                    try {
                        const res = this.parseNFeDoc(docTexto);
                        if (res.erro) { erros.push({ indice: idx + 1, motivo: res.erro }); return; }
                        itens.push(...res.itens);
                    } catch (e) {
                        erros.push({ indice: idx + 1, motivo: e.message });
                    }
                });
                return { itens, erros, totalDocs: docs.length };
            }
        };

        // =========================================================================
        // MÓDULO 3: COMPARADOR & SCORE (comparador.js)
        // =========================================================================
        const ComparadorModulo = {
            CAMPOS_FISCAIS: [
                { key: 'vUnCom', label: 'Valor Unitário', isCurrency: true },
                { key: 'vBC', label: 'Base ICMS', isCurrency: true },
                { key: 'pICMS', label: 'Alíquota ICMS', isCurrency: false },
                { key: 'vICMS', label: 'Valor ICMS', isCurrency: true },
                { key: 'pRedBC', label: 'Redução Base ICMS', isCurrency: false },
                { key: 'pDif', label: 'Percentual Diferimento', isCurrency: false },
                { key: 'vICMSDif', label: 'Valor Diferimento', isCurrency: true },
                { key: 'vBCST', label: 'Base ICMS ST', isCurrency: true },
                { key: 'pICMSST', label: 'Alíquota ST', isCurrency: false },
                { key: 'vICMSST', label: 'Valor ST', isCurrency: true },
                { key: 'pMVAST', label: 'MVA', isCurrency: false },
                { key: 'pRedBCST', label: 'Redução Base ST', isCurrency: false },
                { key: 'vBCFCP', label: 'Base FCP', isCurrency: true },
                { key: 'pFCP', label: 'Alíquota FCP', isCurrency: false },
                { key: 'vFCP', label: 'Valor FCP', isCurrency: true },
                { key: 'vBCFCPST', label: 'Base FCP ST', isCurrency: true },
                { key: 'pFCPST', label: 'Alíquota FCP ST', isCurrency: false },
                { key: 'vFCPST', label: 'Valor FCP ST', isCurrency: true },
                { key: 'vDesc', label: 'Desconto', isCurrency: true },
                { key: 'cst', label: 'CST', isCurrency: false },
                { key: 'csosn', label: 'CSOSN', isCurrency: false },
                { key: 'cfop', label: 'CFOP', isCurrency: false },
                { key: 'ncm', label: 'NCM', isCurrency: false },
                { key: 'cest', label: 'CEST', isCurrency: false }
            ],

            calcularScoreECadastro(nfdItem, nfvItem) {
                let score = 0;
                let matchImpostosCount = 0;
                let totalImpostosVerificados = 0;

                // Critérios de Score solicitados
                if (nfdItem.cst === nfvItem.cst) score += 30;
                if (nfdItem.cEAN && nfvItem.codes.includes(nfdItem.cEAN)) score += 30;
                if (nfdItem.cProd === nfvItem.cProd) score += 20;
                
                const descNFD = UtilsModulo.normalizarTexto(nfdItem.xProd);
                const descNFV = UtilsModulo.normalizarTexto(nfvItem.xProd);
                if (descNFD === descNFV || descNFD.includes(descNFV) || descNFV.includes(descNFD)) {
                    score += 10;
                }

                const proporcao = nfvItem.qCom > 0 ? (nfdItem.qCom / nfvItem.qCom) : 0;

                this.CAMPOS_FISCAIS.forEach(campo => {
                    const valNFD = nfdItem[campo.key];
                    const valNFV = nfvItem[campo.key];

                    if (typeof valNFD === 'number' && typeof valNFV === 'number') {
                        const esperado = campo.key === 'vUnCom' ? valNFV : (valNFV * proporcao);
                        totalImpostosVerificados++;
                        if (Math.abs(valNFD - esperado) < 0.05) {
                            matchImpostosCount++;
                        }
                    } else if (typeof valNFD === 'string') {
                        totalImpostosVerificados++;
                        if (valNFD === valNFV) matchImpostosCount++;
                    }
                });

                if (totalImpostosVerificados > 0 && matchImpostosCount === totalImpostosVerificados) {
                    score += 50;
                } else if (totalImpostosVerificados > 0) {
                    score += Math.round((matchImpostosCount / totalImpostosVerificados) * 30);
                }

                return score;
            },

            comparar(nfdItem, nfvItem) {
                const proporcao = nfvItem.qCom > 0 ? (nfdItem.qCom / nfvItem.qCom) : 0;
                let linhasTabela = [];
                let divergenciasTexto = [];
                let statusGeral = 'match';
                let camposDivergentes = 0;

                this.CAMPOS_FISCAIS.forEach(campo => {
                    const valNFD = nfdItem[campo.key];
                    const valNFV = nfvItem[campo.key];

                    let valorEsperado, memo;
                    if (typeof valNFD === 'number') {
                        valorEsperado = campo.key === 'vUnCom' ? valNFV : (valNFV * proporcao);
                        memo = campo.key === 'vUnCom' ? 'Unitário Base' : `Proporção (${nfdItem.qCom}/${nfvItem.qCom})`;
                    } else {
                        valorEsperado = valNFV;
                        memo = 'Atributo Textual';
                    }

                    if (valNFD === 0 && valorEsperado === 0 && valNFV === 0 && typeof valNFD === 'number') return;

                    let isMatch = true;
                    if (typeof valNFD === 'number') {
                        isMatch = Math.abs(valNFD - valorEsperado) < 0.05;
                    } else {
                        isMatch = String(valNFD).trim() === String(valorEsperado).trim();
                    }

                    let statusStr = '✔ Correto';
                    if (!isMatch) {
                        isMatch = false;
                        statusStr = '❌ Divergente';
                        statusGeral = 'divergente';
                        camposDivergentes++;
                        divergenciasTexto.push(`<b>${campo.label}:</b> Venda = ${UtilsModulo.formatVal(valorEsperado, campo.isCurrency)} | Devolução = ${UtilsModulo.formatVal(valNFD, campo.isCurrency)}`);
                    }

                    let vendaDisp = typeof valNFD === 'number' ? UtilsModulo.formatVal(valorEsperado, campo.isCurrency) : (valorEsperado || 'N/A');
                    let devDisp = typeof valNFD === 'number' ? UtilsModulo.formatVal(valNFD, campo.isCurrency) : (valNFD || 'N/A');

                    linhasTabela.push(`
                        <tr class="border-b ${!isMatch ? 'bg-red-50 text-red-900 font-medium' : 'bg-white text-slate-700'} text-xs">
                            <td class="px-3 py-2 font-bold">${campo.label}</td>
                            <td class="px-3 py-2 font-mono">${vendaDisp}</td>
                            <td class="px-3 py-2 font-mono">${devDisp}</td>
                            <td class="px-3 py-2 text-center font-bold ${!isMatch ? 'text-red-600' : 'text-emerald-600'}">${statusStr}</td>
                        </tr>
                    `);
                });

                return { linhasTabela, divergenciasTexto, statusGeral };
            }
        };

        // =========================================================================
        // MÓDULO 4: INTERFACE & DASHBOARD (interface.js)
        // =========================================================================
        const InterfaceModulo = {
            indiceDivergenciaAtual: -1,

            renderizarDashboard(totalXMLs, totalProdutos, matchCount, divCount, semCount, tempoMs) {
                const painel = document.getElementById('painel-resumo');
                painel.classList.remove('hidden');
                painel.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 text-center">
                            <span class="text-xs font-bold text-slate-400 uppercase">XMLs Processados</span>
                            <p class="text-2xl font-black text-slate-800 mt-1">${totalXMLs}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 text-center">
                            <span class="text-xs font-bold text-slate-400 uppercase">Produtos Devolução</span>
                            <p class="text-2xl font-black text-slate-800 mt-1">${totalProdutos}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-emerald-200 text-center bg-emerald-50/50">
                            <span class="text-xs font-bold text-emerald-600 uppercase">Itens Match</span>
                            <p class="text-2xl font-black text-emerald-700 mt-1">${matchCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-red-200 text-center bg-red-50/50">
                            <span class="text-xs font-bold text-red-600 uppercase">Divergências</span>
                            <p class="text-2xl font-black text-red-700 mt-1">${divCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-300 text-center bg-slate-50">
                            <span class="text-xs font-bold text-slate-500 uppercase">Sem Nota Venda</span>
                            <p class="text-2xl font-black text-slate-700 mt-1">${semCount}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm p-4 border border-blue-200 text-center bg-blue-50/50">
                            <span class="text-xs font-bold text-blue-600 uppercase">Tempo Processo</span>
                            <p class="text-2xl font-black text-blue-700 mt-1">${tempoMs}ms</p>
                        </div>
                    </div>
                `;
            },

            renderizarCartao(d, index) {
                let badgeClasse = d.status === 'match' ? 'bg-emerald-100 text-emerald-800' : (d.status === 'divergente' ? 'bg-red-100 text-red-800' : 'bg-slate-200 text-slate-700');
                let badgeTexto = d.status === 'match' ? '✅ MATCH' : (d.status === 'divergente' ? '❌ DIVERGENTE' : '⚠️ SEM NOTA DE VENDA');

                let blocoDivergencias = '';
                if (d.divergencias && d.divergencias.length > 0) {
                    blocoDivergencias = `
                        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-900">
                            <p class="font-bold mb-1">Divergências Fiscais Localizadas:</p>
                            <ul class="list-disc pl-4 space-y-0.5">${d.divergencias.map(div => `<li>${div}</li>`).join('')}</ul>
                        </div>
                    `;
                }

                let blocoOutrasNotas = '';
                if (d.outrasNotas && d.outrasNotas.length > 0) {
                    const listaOutras = d.outrasNotas.map(o => `<li>NF-e ${o.nNF} (Score: ${o.score})</li>`).join('');
                    blocoOutrasNotas = `
                        <details class="mt-3 text-xs bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <summary class="font-bold text-slate-700 cursor-pointer flex justify-between items-center">
                                <span>📂 Outras notas encontradas (${d.outrasNotas.length})</span>
                                <span class="text-blue-600">▼ Expandir</span>
                            </summary>
                            <ul class="mt-2 space-y-1 pl-4 list-disc text-slate-600">${listaOutras}</ul>
                        </details>
                    `;
                }

                let blocoTabela = '';
                if (d.linhasTabela && d.linhasTabela.length > 0) {
                    blocoTabela = `
                        <div class="overflow-x-auto rounded-lg border border-slate-200">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-600 text-[11px] uppercase font-bold border-b border-slate-200">
                                        <th class="px-3 py-2">Campo</th>
                                        <th class="px-3 py-2">Venda (Proporcional)</th>
                                        <th class="px-3 py-2">Devolução</th>
                                        <th class="px-3 py-2 text-center">Resultado</th>
                                    </tr>
                                </thead>
                                <tbody>${d.linhasTabela.join('')}</tbody>
                            </table>
                        </div>
                    `;
                } else {
                    blocoTabela = `<p class="text-xs text-slate-500 italic">Nenhum dado fiscal comparado para este item sem nota correspondente.</p>`;
                }

                const html = `
                    <div id="cartao-${index}" class="cartao-auditoria bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden" data-status="${d.status}" data-recomendada="${d.isRecomendada}">
                        <div class="p-4 ${d.status} flex justify-between items-center gap-4 border-b border-slate-200">
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-wider opacity-75">Item Devolução #${index + 1}</span>
                                <h3 class="font-bold text-sm md:text-base">${d.xProd}</h3>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-black shadow-sm ${badgeClasse}">${badgeTexto}</span>
                        </div>
                        <div class="p-5">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-xs bg-slate-50 p-3 rounded-lg border border-slate-200 font-mono">
                                <div><b>Qtd Devolução:</b> ${d.qComNFD} un</div>
                                <div><b>NF Venda Ref:</b> ${d.nNFV || 'N/A'} (${d.qComNFV || 0} un)</div>
                                <div><b>EAN:</b> ${d.cEAN || 'N/A'}</div>
                                <div><b>Cód:</b> ${d.cProdNFD}</div>
                            </div>
                            ${blocoDivergencias}
                            ${blocoTabela}
                            ${blocoOutrasNotas}
                        </div>
                    </div>
                `;

                document.getElementById('resultado-auditoria').insertAdjacentHTML('beforeend', html);
            },

            filtrar(filtro) {
                ['todos', 'divergente', 'match', 'sem-nfv', 'recomendada'].forEach(f => {
                    const btn = document.getElementById(`btn-filtro-${f}`);
                    if (!btn) return;
                    if (f === filtro) {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
                    } else {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                    }
                });

                document.querySelectorAll('.cartao-auditoria').forEach(card => {
                    const status = card.getAttribute('data-status');
                    const recomendada = card.getAttribute('data-recomendada');
                    if (filtro === 'todos') {
                        card.style.display = 'block';
                    } else if (filtro === 'recomendada') {
                        card.style.display = recomendada === 'true' ? 'block' : 'none';
                    } else {
                        card.style.display = status === filtro ? 'block' : 'none';
                    }
                });
            },

            rolarParaDivergencia() {
                const divergentes = Array.from(document.querySelectorAll('.cartao-auditoria')).filter(c => c.getAttribute('data-status') === 'divergente');
                if (divergentes.length === 0) return alert("Nenhuma divergência encontrada!");
                this.indiceDivergenciaAtual = 0;
                const el = divergentes[this.indiceDivergenciaAtual];
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.remove('highlight-target'); void el.offsetWidth; el.classList.add('highlight-target');
            },

            proximaDivergencia() {
                const divergentes = Array.from(document.querySelectorAll('.cartao-auditoria')).filter(c => c.getAttribute('data-status') === 'divergente');
                if (divergentes.length === 0) return alert("Nenhuma divergência encontrada!");
                this.indiceDivergenciaAtual = (this.indiceDivergenciaAtual + 1) % divergentes.length;
                const el = divergentes[this.indiceDivergenciaAtual];
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.remove('highlight-target'); void el.offsetWidth; el.classList.add('highlight-target');
            }
        };

        // =========================================================================
        // MÓDULO 5: EXPORTADOR (exportador.js)
        // =========================================================================
        const ExportadorModulo = {
            exportarCSV() {
                if (window.dadosGlobaisAuditoria.length === 0) return alert("Nenhum dado auditado para exportar.");
                let csv = "Produto;Status;Qtd Devolucao;NF Venda;EAN;Divergencias\n";
                window.dadosGlobaisAuditoria.forEach(d => {
                    const divText = (d.divergencias || []).join(' | ').replace(/<\/?[^>]+(>|$)/g, "");
                    csv += `"${d.xProd}";"${d.status}";"${d.qComNFD}";"${d.nNFV || 'N/A'}";"${d.cEAN || ''}";"${divText}"\n`;
                });
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'auditoria_fiscal_devolucao.csv';
                a.click();
            },

            exportarExcel() {
                if (window.dadosGlobaisAuditoria.length === 0) return alert("Nenhum dado auditado para exportar.");
                let html = '<table><tr><th>Produto</th><th>Status</th><th>Qtd Devolução</th><th>NF Venda</th><th>EAN</th><th>Divergências</th></tr>';
                window.dadosGlobaisAuditoria.forEach(d => {
                    const divText = (d.divergencias || []).join(' | ').replace(/<\/?[^>]+(>|$)/g, "");
                    html += `<tr><td>${d.xProd}</td><td>${d.status}</td><td>${d.qComNFD}</td><td>${d.nNFV || 'N/A'}</td><td>${d.cEAN || ''}</td><td>${divText}</td></tr>`;
                });
                html += '</table>';
                const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'auditoria_fiscal_devolucao.xls';
                a.click();
            },

            exportarPDF() {
                window.print();
            }
        };

        // =========================================================================
        // MÓDULO 6: CONTROLADOR PRINCIPAL (main.js)
        // =========================================================================
        const AppModulo = {
            limparDados() {
                document.getElementById('xmlNFV').value = '';
                document.getElementById('xmlNFD').value = '';
                document.getElementById('fileNFV').value = '';
                document.getElementById('fileNFD').value = '';
                document.getElementById('resultado-auditoria').innerHTML = '';
                document.getElementById('painel-resumo').innerHTML = '';
                document.getElementById('painel-resumo').classList.add('hidden');
                document.getElementById('painel-filtros').classList.add('hidden');
                document.getElementById('avisos').innerHTML = '';
                document.getElementById('avisos').classList.add('hidden');
                window.dadosGlobaisAuditoria = [];
            },

            executarAuditoria() {
                const tempoInicio = performance.now();
                const strNFV = document.getElementById('xmlNFV').value;
                const strNFD = document.getElementById('xmlNFD').value;
                const container = document.getElementById('resultado-auditoria');

                container.innerHTML = '';
                document.getElementById('painel-resumo').innerHTML = '';
                document.getElementById('painel-resumo').classList.add('hidden');
                document.getElementById('painel-filtros').classList.add('hidden');
                document.getElementById('avisos').innerHTML = '';
                document.getElementById('avisos').classList.add('hidden');
                window.dadosGlobaisAuditoria = [];

                if (!strNFV || !strNFD) return alert("Carregue os arquivos XML de Venda e de Devolução antes de processar.");

                const resNFD = ParserModulo.parseCaixaTexto(strNFD);
                const resNFV = ParserModulo.parseCaixaTexto(strNFV);

                this.renderizarAvisos(resNFD.erros, resNFD.totalDocs, resNFV.erros, resNFV.totalDocs);

                if (resNFD.itens.length === 0) return alert("Nenhum item válido encontrado nas notas de DEVOLUÇÃO.");
                if (resNFV.itens.length === 0) return alert("Nenhum item válido encontrado nas notas de VENDA.");

                // Índices Map() para máxima performance
                const mapaChave = new Map();
                const mapaEAN = new Map();
                const mapaCodigo = new Map();

                resNFV.itens.forEach(item => {
                    if (item.chave) {
                        if (!mapaChave.has(item.chave)) mapaChave.set(item.chave, []);
                        mapaChave.get(item.chave).push(item);
                    }
                    item.codes.forEach(ean => {
                        if (!mapaEAN.has(ean)) mapaEAN.set(ean, []);
                        mapaEAN.get(ean).push(item);
                    });
                    if (item.cProd) {
                        if (!mapaCodigo.has(item.cProd)) mapaCodigo.set(item.cProd, []);
                        mapaCodigo.get(item.cProd).push(item);
                    }
                });

                let matchCount = 0, divCount = 0, semCount = 0;

                resNFD.itens.forEach(nfdItem => {
                    let escopo = [];
                    if (nfdItem.refs && nfdItem.refs.length > 0) {
                        nfdItem.refs.forEach(ch => {
                            if (mapaChave.has(ch)) escopo.push(...mapaChave.get(ch));
                        });
                    }
                    if (escopo.length === 0) {
                        nfdItem.codes.forEach(ean => {
                            if (mapaEAN.has(ean)) escopo.push(...mapaEAN.get(ean));
                        });
                    }
                    if (escopo.length === 0 && nfdItem.cProd && mapaCodigo.has(nfdItem.cProd)) {
                        escopo.push(...mapaCodigo.get(nfdItem.cProd));
                    }
                    if (escopo.length === 0) {
                        escopo = resNFV.itens;
                    }

                    // Remover duplicatas do escopo
                    const vistos = new Set();
                    const candidatos = escopo.filter(c => {
                        const chaveUnica = c.chave + '|' + c.cProd + '|' + c.nNF;
                        if (vistos.has(chaveUnica)) return false;
                        vistos.add(chaveUnica);
                        return true;
                    });

                    if (candidatos.length === 0) {
                        semCount++;
                        const dadosItem = {
                            status: 'sem-nfv', isRecomendada: true, xProd: nfdItem.xProd, qComNFD: nfdItem.qCom,
                            cEAN: nfdItem.cEAN, cProdNFD: nfdItem.cProd, linhasTabela: [], divergencias: [], outrasNotas: []
                        };
                        window.dadosGlobaisAuditoria.push(dadosItem);
                        InterfaceModulo.renderizarCartao(dadosItem, window.dadosGlobaisAuditoria.length - 1);
                        return;
                    }

                    // Avaliar score de cada candidato
                    const pontuados = candidatos.map(candidato => ({
                        item: candidato,
                        score: ComparadorModulo.score = ComparadorModulo.calcularScoreECadastro(nfdItem, candidato),
                        comparacao: ComparadorModulo.comparar(nfdItem, candidato)
                    })).sort((a, b) => b.score - a.score);

                    const melhor = pontuados[0];
                    if (melhor.comparacao.statusGeral === 'match') matchCount++;
                    else divCount++;

                    const outrasNotas = pontuados.slice(1).map(p => ({ nNF: p.item.nNF, score: p.score }));

                    const dadosItem = {
                        status: melhor.comparacao.statusGeral,
                        isRecomendada: true,
                        xProd: nfdItem.xProd,
                        qComNFD: nfdItem.qCom,
                        nNFV: melhor.item.nNF,
                        qComNFV: melhor.item.qCom,
                        cEAN: nfdItem.cEAN,
                        cProdNFD: nfdItem.cProd,
                        linhasTabela: melhor.comparacao.linhasTabela,
                        divergencias: melhor.comparacao.divergenciasTexto,
                        outrasNotas
                    };

                    window.dadosGlobaisAuditoria.push(dadosItem);
                    InterfaceModulo.renderizarCartao(dadosItem, window.dadosGlobaisAuditoria.length - 1);
                });

                const tempoFim = performance.now();
                const tempoTotal = Math.round(tempoFim - tempoInicio);

                InterfaceModulo.renderizarDashboard(resNFV.totalDocs + resNFD.totalDocs, resNFD.itens.length, matchCount, divCount, semCount, tempoTotal);
                document.getElementById('painel-filtros').classList.remove('hidden');
            },

            renderizarAvisos(errosNFD, totalNFD, errosNFV, totalNFV) {
                const el = document.getElementById('avisos');
                const blocos = [];
                if (errosNFD.length > 0) blocos.push(`<p>⚠️ Devolução: ${errosNFD.length} de ${totalNFD} arquivos ignorados por formato inválido.</p>`);
                if (errosNFV.length > 0) blocos.push(`<p>⚠️ Venda: ${errosNFV.length} de ${totalNFV} arquivos ignorados por formato inválido.</p>`);
                if (blocos.length === 0) return;
                el.classList.remove('hidden');
                el.innerHTML = `<div class="p-4 bg-amber-50 border border-amber-300 rounded-xl text-amber-900 text-xs font-medium">${blocos.join('')}</div>`;
            }
        };

        window.dadosGlobaisAuditoria = [];
    </script>
</body>
</html>
